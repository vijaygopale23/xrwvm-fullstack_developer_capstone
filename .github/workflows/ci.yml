name: Capstone CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Django dependencies
        run: python -m pip install -r server/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Build React frontend
        working-directory: server/frontend
        run: npm ci && npm run build
      - name: Check Django project
        working-directory: server
        run: python manage.py check
      - name: Collect static assets
        working-directory: server
        run: python manage.py collectstatic --noinput
      - name: Run Django tests
        working-directory: server
        run: python manage.py test
      - name: Check dealership API syntax
        run: node --check server/database/app.js
