version: '3.9'

services:
  # Mongodb service
  mongo_db:
    container_name: db_container
    image: mongo:latest
    ports:
      - "127.0.0.1:27017:27017"
    restart: always
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Node api service
  api:
    build: .
    image: nodeapp
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      MONGODB_URI: mongodb://mongo_db:27017/
    depends_on:
      mongo_db:
        condition: service_healthy

volumes:
  mongo_data: {}
